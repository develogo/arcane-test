services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: poc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-poc}  # shortcut: fixed POC password, use .env/secrets outside local env
      POSTGRES_DB: poc
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U poc']
      interval: 10s
      retries: 5
    restart: unless-stopped

  adminer:
    image: adminer
    ports:
      - '8084:8080'
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
